<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0c" />
    <title>Tour 360°</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="viewer"></div>

    <div class="splash" aria-hidden="true">
      <div class="splash__mark">360°</div>
      <div class="splash__bar"><span></span></div>
    </div>

    <header class="top">
      <div class="brand">
        <h1 data-name></h1>
        <p><span data-subtitle></span> <span class="brand__addr" data-address></span></p>
      </div>
      <a class="cta" data-cta hidden target="_blank" rel="noopener"></a>
    </header>

    <aside class="room-info">
      <h2 data-room-title></h2>
      <p data-room-desc></p>
    </aside>

    <nav class="controls" aria-label="Controles">
      <button data-action="zoom-in" title="Aproximar" aria-label="Aproximar">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg>
      </button>
      <button data-action="zoom-out" title="Afastar" aria-label="Afastar">
        <svg viewBox="0 0 24 24"><path d="M5 12h14" /></svg>
      </button>
      <button data-action="autorotate" title="Girar automaticamente" aria-label="Girar automaticamente">
        <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" /></svg>
      </button>
      <button data-action="gyroscope" title="Mover com o celular" aria-label="Mover com o celular" hidden>
        <svg viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="2" /><path d="M11 18h2" /></svg>
      </button>
      <button data-action="fullscreen" title="Tela cheia" aria-label="Tela cheia">
        <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" /></svg>
      </button>
    </nav>

    <footer class="rooms" data-rooms></footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>

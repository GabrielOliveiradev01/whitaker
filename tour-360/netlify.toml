# Deploy separado: no Netlify, defina "Base directory" = tour-360
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/panoramas/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
